name: Feature request
description: Suggest an improvement for CiteDock.
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: What are you trying to do?
      description: Describe the real workflow and who would benefit.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives or examples if useful.
    validations:
      required: true
